    <script>
      (function () {
        try {
          var ownDesc = Object.getOwnPropertyDescriptor(window, 'fetch');
          var target = window;
          var desc = ownDesc;
          while (!desc && target) {
            target = Object.getPrototypeOf(target);
            if (target) desc = Object.getOwnPropertyDescriptor(target, 'fetch');
          }
          if (desc && typeof desc.set !== 'function' && (!ownDesc || ownDesc.configurable)) {
            var currentFetch = window.fetch;
            Object.defineProperty(window, 'fetch', {
              configurable: true,
              enumerable: true,
              get: function () { return currentFetch; },
              set: function (fn) { currentFetch = fn; }
            });
          }
        } catch (_) {}
        window.addEventListener('error', function (ev) {
          if (ev && typeof ev.filename === 'string' && ev.filename.indexOf('chrome-extension://') === 0) {
            ev.preventDefault();
          }
        }, true);
      })();
    </script>
